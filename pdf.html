<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>عرض وطباعة الصورة PDF</title>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 14px;
    }
    .card {
      width: 100%;
      max-width: 820px;
      background: #ffffff;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      text-align: center;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 18px;
    }
    button {
      border: 0;
      border-radius: 10px;
      padding: 11px 20px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-pdf {
      background: #2563eb;
      color: #fff;
    }
    .btn-print {
      background: #0f172a;
      color: #fff;
    }
    .preview-wrap img {
      max-width: 100%;
      height: auto;
      border-radius: 10px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
    }
    .status {
      margin-top: 12px;
      font-size: 14px;
      color: #475569;
    }
    @media print {
      body { background: #fff; padding: 0; }
      .card { box-shadow: none; max-width: 100%; padding: 0; }
      .actions, .status { display: none; }
      .preview-wrap img { border-radius: 0; box-shadow: none; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="actions">
      <button class="btn-pdf" id="openPdfBtn" type="button">فتح PDF في المتصفح</button>
      <button class="btn-print" id="printBtn" type="button">طباعة الصورة</button>
    </div>
    <div class="preview-wrap">
      <img id="targetImg" alt="معاينة الصورة" />
    </div>
    <div class="status" id="statusMsg">جاري تحميل الصورة...</div>
  </div>

  <script>
    // عدّل مسار مجلد الصور حسب موقعك
    const IMAGES_FOLDER = "./images";
    const ALLOWED_EXTS = ["webp", "jpg", "jpeg", "png"];

    const params = new URLSearchParams(window.location.search);
    const rawImg = (params.get("img") || "").trim();
    const safeName = rawImg.replace(/[\\\/]+/g, "").replace(/\.\./g, "");

    const imgEl = document.getElementById("targetImg");
    const statusEl = document.getElementById("statusMsg");
    const openPdfBtn = document.getElementById("openPdfBtn");
    const printBtn = document.getElementById("printBtn");

    function buildCandidates(name) {
      if (!name) return [];
      const hasExt = ALLOWED_EXTS.some(ext => name.toLowerCase().endsWith("." + ext));
      if (hasExt) return [`${IMAGES_FOLDER}/${name}`];
      return ALLOWED_EXTS.map(ext => `${IMAGES_FOLDER}/${name}.${ext}`);
    }

    function loadFirstAvailableImage(urls, index = 0) {
      if (index >= urls.length) {
        statusEl.textContent = "تعذر العثور على الصورة المطلوبة.";
        return;
      }
      const candidateUrl = urls[index];
      const probe = new Image();
      probe.crossOrigin = "anonymous";
      probe.onload = () => {
        imgEl.crossOrigin = "anonymous";
        imgEl.src = candidateUrl;
        imgEl.alt = safeName;
        statusEl.textContent = `الصورة جاهزة (${probe.naturalWidth} × ${probe.naturalHeight} px)`;
      };
      probe.onerror = () => loadFirstAvailableImage(urls, index + 1);
      probe.src = candidateUrl;
    }

    function generatePdfBlobUrl() {
      const { jsPDF } = window.jspdf;
      const w = imgEl.naturalWidth || 1000;
      const h = imgEl.naturalHeight || 1000;
      const pdfW = Math.max(72, w * 0.75);
      const pdfH = Math.max(72, h * 0.75);
      const orientation = pdfW >= pdfH ? "landscape" : "portrait";

      const doc = new jsPDF({
        orientation,
        unit: "pt",
        format: [pdfW, pdfH]
      });

      const canvas = document.createElement("canvas");
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(imgEl, 0, 0, w, h);
      const dataUrl = canvas.toDataURL("image/jpeg", 0.92);

      doc.addImage(dataUrl, "JPEG", 0, 0, pdfW, pdfH);
      return doc.output("bloburl");
    }

    openPdfBtn.addEventListener("click", () => {
      if (!imgEl.complete || !imgEl.naturalWidth) return;
      try {
        const blobUrl = generatePdfBlobUrl();
        window.open(blobUrl, "_blank", "noopener,noreferrer");
      } catch (err) {
        statusEl.textContent = "تعذر إنشاء ملف PDF (تأكد أن الصورة من نفس النطاق أو تدعم CORS).";
      }
    });

    printBtn.addEventListener("click", () => {
      window.print();
    });

    if (!safeName) {
      statusEl.textContent = "مرر اسم الصورة في الرابط مثل: ?img=photo_name";
    } else {
      loadFirstAvailableImage(buildCandidates(safeName));
    }
  </script>
</body>
</html>
